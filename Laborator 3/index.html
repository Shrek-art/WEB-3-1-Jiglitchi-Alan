
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piatra, Hartia, Foarfeca</title>
</head>
<body>

    <h1>Piatra, Hartia, Foarfeca</h1>

    <h2>Alege o varianta:</h2>

    <button id="rock">Piatra</button>
    <button id="paper">Hârtia</button>
    <button id="scissors">Foarfeca</button>

    <h2>Rezultatul rundei</h2>

    <p id="playerChoice">Alegerea ta: -</p>
    <p id="computerChoice">Alegerea calculatorului: -</p>

    <h2 id="result">Alege o varianta pentru a incepe!</h2>

    <h2>Scor</h2>

    <p id="score">Jucător: 0 | Calculator: 0 | Egalități: 0</p>

    <p id="rounds">Runde jucate: 0</p>

    <p id="leader">Scorul este egal!</p>

    <button id="newGame">Joc nou</button>

    <script src="script.js"></script>

</body>
</html>
